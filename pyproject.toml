[project]
name = "provo-v2"
version = "0.1.0"
description = "Synchronise les posts Instagram sauvegardés vers Karakeep via Temporal (Worker Deployment Versioning, workflow.patched, tests time-skipping et replay)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.37.0",
    "temporalio>=1.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

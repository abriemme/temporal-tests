[project]
name = "ig-to-karakeep"
version = "0.1.0"
description = "Sync Instagram saved posts to Karakeep via Temporal, with pydantic-ai LLM enrichment (Worker Deployment Versioning, time-skipping and replay tests)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "logfire[system-metrics]>=4.41.0",
    "pydantic-ai>=2.37.0",
    "pydantic-ai-slim[openai]>=2.37.0",
    "requests>=2.32",
    "temporalio>=1.32.0",
]

# Instagram private-API client + TOTP, only needed on the machine that runs
# the sync activities (worker): `uv sync --group ig`.
[dependency-groups]
ig = [
    "instagrapi>=2.1",
    "pyotp>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Lazy re-export package: TYPE_CHECKING imports + runtime __getattr__.
"app/sync/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

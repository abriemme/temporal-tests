name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Ruff lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Tests + replay
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen

      # Unit tests (time-skipping) + replay test on the histories committed in
      # tests/histories/. Replay downloads the bundled Temporal test server;
      # nothing else to provision.
      - name: Run tests (unit + replay)
        env:
          GIT_SHA: ${{ github.sha }}
        run: uv run pytest -v

  docker:
    name: Build & push image (tag = SHA)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged with the git SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only push on the default branch; otherwise build only.
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

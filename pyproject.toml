[project]
name = "provo-v2"
version = "0.1.0"
description = "Sync Instagram saved posts to Karakeep via Temporal (Worker Deployment Versioning, workflow.patched, time-skipping and replay tests)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.37.0",
    "requests>=2.32",
    "temporalio>=1.32.0",
]

# Instagram private-API client + TOTP, only needed on the machine that runs
# the sync activities (worker): `uv sync --group ig`.
[dependency-groups]
ig = [
    "instagrapi>=2.1",
    "pyotp>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
